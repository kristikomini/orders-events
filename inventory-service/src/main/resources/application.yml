spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate    # schema owned by Flyway (standards rule 1)
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
    producer:
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
