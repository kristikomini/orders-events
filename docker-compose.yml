# Kafka (KRaft, no ZooKeeper), Postgres per service, Redis, Prometheus. App services added
# during fill once each has a Dockerfile.
services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: kraft-cluster-orders-01
    ports: [ "9092:9092" ]

  postgres-orders:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: orders, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: [ "5433:5432" ]

  postgres-inventory:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: inventory, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: [ "5434:5432" ]

  postgres-shipment:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: shipment, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: [ "5435:5432" ]

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: [ "9090:9090" ]
    # TODO(fill): mount ./ops/prometheus.yml scraping the three services' /actuator/prometheus

  # TODO(fill): order-service / inventory-service / shipment-service — build each module.
